<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聖經拼圖 - 彼得前書 3:18</title>
    <!-- 引入灑花特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #fdfbf7, #fef3c7); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 10px; 
            font-family: "Microsoft JhengHei", sans-serif; 
            overflow: hidden; 
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%;
            max-width: 550px;
            max-height: 98vh;
            background: #ffffff;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        #home-screen, #game-ui { 
            text-align: center; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }

        /* 首頁說明樣式調整 */
        #home-screen {
            max-height: 90vh;
            overflow-y: auto;
            padding: 5px;
        }

        .intro-box {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            max-height: 200px;
            overflow-y: auto;
        }
        .intro-box h3 {
            margin: 5px 0;
            font-size: 16px;
            color: #b45309;
        }
        .intro-box p {
            margin: 5px 0;
            font-size: 13px;
            color: #334155;
            line-height: 1.4;
        }
        
        #status-bar { 
            display: flex; 
            justify-content: space-around; 
            width: 100%; 
            font-size: 20px; 
            font-weight: bold; 
            color: #2c3e50; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 8px; 
            margin-bottom: 8px;
        }
        
        #visual-area { 
            height: 70px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            background: #f8fafc;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            padding: 8px;
            box-sizing: border-box;
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
        }

        .slot-box {
            width: 38px;
            height: 38px;
            background: #e2e8f0;
            border: 2px solid #94a3b8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #16a34a;
        }
        .slot-box.filled {
            background: #dcfce7;
            border-color: #22c55e;
        }
        
        #question { font-size: 24px; font-weight: bold; color: #b45309; margin: 6px 0; }
        
        .hint-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 35px;
            margin: 4px 0;
        }

        #hint-btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 5px 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            touch-action: manipulation;
        }
        #hint-btn:hover { background-color: #d97706; }

        #feedback { font-size: 18px; color: #e67e22; font-weight: bold; }
        
        /* 掉落答案遊戲區域 */
        #drop-game-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #f1f5f9;
            border: 3px solid #cbd5e1;
            border-radius: 14px;
            overflow: hidden;
            box-sizing: border-box;
            margin-top: 5px;
        }

        /* 散落掉落的單字方塊樣式 */
        .falling-char {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #fde047 60%, #eab308 100%);
            border: 2px solid #ca8a04;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #78350f;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            animation: fall linear forwards;
            z-index: 10;
            touch-action: manipulation;
        }
        .falling-char:active { transform: scale(0.9); }

        @keyframes fall {
            0% { top: -65px; }
            100% { top: 130px; }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button#start-btn, .control-btn { 
            padding: 12px 30px; 
            font-size: 20px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(59,130,246,0.3);
            font-weight: bold;
            touch-action: manipulation;
        }
        button#start-btn:hover, .control-btn:hover { background: #2563eb; }
        
        #pause-btn {
            background: #d97706;
        }
        #pause-btn:hover {
            background: #b45309;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- 首頁畫面 -->
    <div id="home-screen">
        <h1 style="font-size: 28px; color: #1e293b; margin: 5px 0;">✝️ 聖經經文連線冒險</h1>
        
        <!-- 經文與說明對照區 -->
        <div class="intro-box">
            <h3>📖 彼得前書 3:18：</h3>
            <p>因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前，按著肉體說祂被治死，按著靈性說祂復活了。</p>
            
            <h3 style="margin-top: 8px;">💡 經文意義：</h3>
            <p>基督為了我們的罪承受痛苦與死刑，他是完全公義的卻代替了我們這些不義的人，目的是為了把我們帶回到神的身邊。在肉體上祂雖然被治死，但在靈性上祂復活了，彰顯神的大能與救贖。</p>
        </div>

        <p style="color: #64748b; font-size: 14px; margin: 0 0 10px 0;">看上面的句意，按順序點擊掉落的字來重組經文！</p>
        <button id="start-btn">開始玩遊戲</button>
    </div>

    <!-- 遊戲中畫面 -->
    <div id="game-ui" style="display:none;">
        <div id="status-bar">
            <div id="timer">時間: 00:00</div>
            <div id="score">闖關: 0 / 6</div>
        </div>
        
        <!-- 上方排排站區 -->
        <div id="visual-area">請根據提示，點擊掉落的字！</div>
        <div id="question">經文題目載入中...</div>
        
        <!-- 提示按鈕與訊息 -->
        <div class="hint-container">
            <button id="hint-btn">參考經文</button>
            <div id="feedback">字掉下來囉！</div>
        </div>
        
        <!-- 掉落答案區域 -->
        <div id="drop-game-container"></div>

        <!-- 暫停按鈕區 -->
        <div class="btn-group">
            <button id="pause-btn" class="control-btn">暫停遊戲</button>
        </div>
    </div>
</div>

    <script>
        const idiomsData = [
            { id: 1, classic: "因基督也曾一次為罪受苦", modern: "基督為了我們的罪，曾經受過苦。" },
            { id: 2, classic: "就是義的代替不義的", modern: "由完全公義的來代替我們這些不義的人。" },
            { id: 3, classic: "為要引我們到神面前", modern: "目的是為了帶領我們回到神的面前。" },
            { id: 4, classic: "按著肉體說祂被治死", modern: "從肉體的身分來看，祂為我們被釘十字架治死。" },
            { id: 5, classic: "按著靈性說祂復活了", modern: "但在靈性與復活的大能上，祂勝過死亡復活了。" },
            { id: 6, classic: "彼前3:18", modern: "出自彼得前書三章十八節。" }
        ];

        let currentIndex = 0;
        let currentItem = null;
        let score = 0;
        let gameInterval = null;
        let activeChars = [];
        let isPaused = false;
        let timerInterval = null;
        let totalSeconds = 0; 
        let audioCtx = null;

        let targetChars = [];
        let nextCharIndex = 0;

        function playSuccessSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.15); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);  
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.45); 

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.7);
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        function playErrorSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        function initGame(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (err) {
                console.log("AudioContext init error:", err);
            }

            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            score = 0;
            totalSeconds = 0;
            isPaused = false;
            currentIndex = 0;
            
            const pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerText = "暫停遊戲";
            pauseBtn.style.backgroundColor = "#d97706";

            document.getElementById('score').innerText = `闖關: ${score} / ${idiomsData.length}`;
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                    let s = (totalSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('timer').innerText = `時間: ${m}:${s}`;
                }
            }, 1000);
        }

        function togglePause(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            
            if (isPaused) {
                pauseBtn.innerText = "繼續遊戲";
                pauseBtn.style.backgroundColor = "#16a34a";
                document.getElementById('feedback').innerText = "⏸️ 遊戲已暫停";
                activeChars.forEach(el => {
                    el.style.animationPlayState = 'paused';
                });
            } else {
                pauseBtn.innerText = "暫停遊戲";
                pauseBtn.style.backgroundColor = "#d97706";
                document.getElementById('feedback').innerText = "▶️ 遊戲繼續！";
                activeChars.forEach(el => {
                    el.style.animationPlayState = 'running';
                });
            }
        }

        function loadQuestion() {
            if (gameInterval) clearInterval(gameInterval);
            activeChars.forEach(el => el.remove());
            activeChars = [];

            if (currentIndex >= idiomsData.length) {
                if (timerInterval) clearInterval(timerInterval);
                document.getElementById('question').innerText = "🎉 恭喜通關全部經文背誦測驗！";
                document.getElementById('visual-area').innerHTML = "太棒了！你已經完全掌握這節經文了！";
                document.getElementById('feedback').innerText = `總共耗時: ${Math.floor(totalSeconds / 60)}分 ${totalSeconds % 60}秒`;
                confetti({ particleCount: 300, spread: 120, origin: { y: 0.5 } });
                playSuccessSound();
                return;
            }

            currentItem = idiomsData[currentIndex];
            targetChars = currentItem.classic.split('');
            nextCharIndex = 0;
            
            document.getElementById('question').innerText = currentItem.modern;
            updateVisualSlots();
            document.getElementById('feedback').innerText = `單字掉下來囉！請按順序點擊`;

            // 按照順序依序讓字掉下來，並稍微隨機調換一兩個字的順序
            let dropIndex = 0;
            // 建立一個接近原本順序但隨機微調的掉落序列
            let sequenceIndices = targetChars.map((_, i) => i);
            if (sequenceIndices.length >= 3) {
                // 隨機選一個位置和它相鄰的位置互換一兩次，保持大體順序但有隨機感
                let swapPos = Math.floor(Math.random() * (sequenceIndices.length - 1));
                let temp = sequenceIndices[swapPos];
                sequenceIndices[swapPos] = sequenceIndices[swapPos + 1];
                sequenceIndices[swapPos + 1] = temp;
            }

            gameInterval = setInterval(() => {
                if (isPaused) return;
                if (dropIndex < sequenceIndices.length) {
                    let charToDrop = targetChars[sequenceIndices[dropIndex]];
                    spawnFallingChar(charToDrop);
                    dropIndex++;
                } else {
                    // 一輪掉完後重置循環掉落
                    dropIndex = 0;
                }
            }, 1200);
        }

        function updateVisualSlots() {
            let area = document.getElementById('visual-area');
            area.innerHTML = '';
            for (let i = 0; i < targetChars.length; i++) {
                let box = document.createElement('div');
                box.className = 'slot-box';
                if (i < nextCharIndex) {
                    box.classList.add('filled');
                    box.innerText = targetChars[i];
                } else {
                    box.innerText = '_';
                }
                area.appendChild(box);
            }
        }

        function showHint(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (!currentItem) return;
            document.getElementById('feedback').innerText = `經文：${currentItem.classic}`;
        }

        function spawnFallingChar(charVal) {
            const container = document.getElementById('drop-game-container');
            const charEl = document.createElement('div');
            charEl.className = 'falling-char';
            charEl.innerText = charVal;

            // 隨機水平位置分散掉落，避免排成一直線
            const randomX = Math.random() * (container.clientWidth - 55);
            charEl.style.left = Math.max(5, randomX) + 'px';

            const duration = 3.5 + Math.random() * 1.5;
            charEl.style.animationDuration = duration + 's';

            if (isPaused) {
                charEl.style.animationPlayState = 'paused';
            }

            let isCharHandled = false;
            const handleCharSelect = function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (isPaused || isCharHandled) return;

                if (charVal === targetChars[nextCharIndex]) {
                    isCharHandled = true;
                    nextCharIndex++;
                    updateVisualSlots();

                    if (nextCharIndex >= targetChars.length) {
                        score++;
                        document.getElementById('score').innerText = `闖關: ${score} / ${idiomsData.length}`;
                        document.getElementById('feedback').innerText = "🎉 太棒了！這句排對囉！";
                        
                        playSuccessSound();
                        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

                        clearInterval(gameInterval);
                        activeChars.forEach(el => el.remove());
                        activeChars = [];

                        currentIndex++;
                        setTimeout(() => {
                            if (!isPaused) loadQuestion();
                        }, 2500);
                    } else {
                        playSuccessSound();
                        charEl.style.transition = "transform 0.2s, opacity 0.2s";
                        charEl.style.transform = "scale(1.4)";
                        charEl.style.opacity = "0";
                        setTimeout(() => charEl.remove(), 200);
                    }
                } else {
                    playErrorSound();
                    document.getElementById('feedback').innerText = `❌ 順序不對喔！要找「${targetChars[nextCharIndex]}」`;
                    
                    charEl.style.transition = "opacity 0.3s";
                    charEl.style.opacity = "0";
                    setTimeout(() => charEl.remove(), 300);
                }
            };

            charEl.addEventListener('click', handleCharSelect);
            charEl.addEventListener('touchstart', handleCharSelect, { passive: false });

            charEl.addEventListener('animationend', () => {
                charEl.remove();
                activeChars = activeChars.filter(item => item !== charEl);
            });

            container.appendChild(charEl);
            activeChars.push(charEl);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            const pauseBtn = document.getElementById('pause-btn');
            const hintBtn = document.getElementById('hint-btn');

            if (startBtn) {
                startBtn.addEventListener('click', initGame);
                startBtn.addEventListener('touchstart', initGame, { passive: false });
            }

            if (pauseBtn) {
                pauseBtn.addEventListener('click', togglePause);
                pauseBtn.addEventListener('touchstart', togglePause, { passive: false });
            }

            if (hintBtn) {
                hintBtn.addEventListener('click', showHint);
                hintBtn.addEventListener('touchstart', showHint, { passive: false });
            }
        });
    </script>
</body>
</html>
