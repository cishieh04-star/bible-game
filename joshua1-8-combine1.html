/* iPhone / iPad 聲音解鎖：必須在使用者點擊的當下執行 */
let audioCtx = null;
function unlockAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
    }
  }catch(e){}
  try{
    if ('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(' ');
      u.lang = 'zh-TW'; u.volume = 0;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function openGame(html, title, welcome, isPlay){
  unlockAudio();
  toHub.hidden = !isPlay;
  if (welcome){ try{ const w = new SpeechSynthesisUtterance(welcome); w.lang='zh-TW'; w.rate=0.85; w.onend=w.onerror=()=>{window.__pw=false}; window.__pw=true; window.speechSynthesis.speak(w); }catch(e){} }
  menu.style.display = 'none';
  barTitle.textContent = title;
  stage.classList.add('on');
  fr.onload = () => {
    try{
      const ss = fr.contentWindow.speechSynthesis;
      if (ss && !ss.__oneVoice){
        const sp = ss.speak.bind(ss), cc = ss.cancel.bind(ss);
        ss.speak = u => { if (window.__pw){ window.__pw=false; try{ window.speechSynthesis.cancel(); }catch(e){} setTimeout(()=>sp(u),150); return; } return sp(u); };
        ss.cancel = () => { if (window.__pw){ window.__pw=false; try{ window.speechSynthesis.cancel(); }catch(e){} } return cc(); };
        ss.__oneVoice = true;
      }
    }catch(e){}
  };
  fr.setAttribute('srcdoc', html);
}
function toMenu(){
  toHub.hidden = true;
  try{ fr.contentWindow.speechSynthesis.cancel(); }catch(e){}
  try{ window.speechSynthesis.cancel(); }catch(e){}
  stage.classList.remove('on');
  fr.removeAttribute('srcdoc');
  fr.setAttribute('src', 'about:blank');
  menu.style.display = '';
}
document.getElementById('btnA').onclick = () => openGame(A_HTML, '神的話(活潑版)(書1:8)', '神的話，活潑版。', false);
document.getElementById('btnB').onclick = () => openGame(B_HTML, '神的話(靜態版)(書1:8)', '神的話，靜態版。', false);
document.getElementById('btnC').onclick = () => openGame(C_HTML, '神的話(燈塔之光版)(書1:8)', '歡迎來到燈塔之光！先到故事屋聽約書亞的故事，再一關一關玩。', true);
back.onclick = toMenu;
</script>
