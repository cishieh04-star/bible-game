<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聖經拼圖 - 帖撒羅尼迦前書 5:16-18</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft JhengHei', sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 10px; background-color: #fdf6e3; margin: 0; 
            min-height: 100vh; position: relative; overflow-x: hidden; 
            touch-action: manipulation;
        }
        .full-width { width: 100%; max-width: 600px; text-align: center; }
        
        #timer { 
            position: fixed; top: 15px; right: 15px; font-size: 16px; font-weight: bold; 
            color: #8b4513; background: white; padding: 5px 10px; border-radius: 10px; 
            border: 2px solid #8b4513; z-index: 1000;
        }

        /* 經文卡片樣式 */
        .verse-card {
            background-color: #fff8e1;
            border: 2px solid #e6c27e;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .verse-text { font-size: 18px; font-weight: bold; color: #5d4037; line-height: 1.6; margin-bottom: 10px; }
        .verse-ref { font-size: 14px; color: #8b4513; font-weight: bold; }

        h2 { color: #8b4513; margin: 10px 0; font-size: 20px; }
        
        .action-container { margin: 10px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .yt-link { text-decoration: none; padding: 6px 12px; background: #FF0000; color: white; border-radius: 5px; font-size: 13px; font-weight: bold; }
        .preview-btn { padding: 6px 12px; background: #5c6bc0; color: white; border: none; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin: 15px 0; align-items: center; }
        .slot { width: 28px; height: 28px; border: 2px dashed #8b4513; display: flex; align-items: center; justify-content: center; background-color: #fff; border-radius: 5px; font-weight: bold; font-size: 14px; color: #333; }
        
        .punctuation { font-size: 16px; font-weight: bold; color: #5d6d7e; margin: 0 1px; }
        .instruction { color: #5d6d7e; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        
        #tetris-container {
            width: 100%; max-width: 500px; height: 120px; background-color: #ffffff;
            border-radius: 8px; position: relative; overflow: hidden; margin-top: 10px;
            border: 2px solid #8b4513; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tetris-block {
            position: absolute; display: flex; gap: 4px; justify-content: center; left: 50%;
            transform: translateX(-50%); transition: top 0.05s linear; width: 95%;
        }

        .tetris-word {
            width: 40px; height: 40px; background-color: #8b4513; color: #ffffff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 18px; font-weight: bold; border-radius: 6px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2); user-select: none; flex-shrink: 0;
        }
        .tetris-word.hidden {
            visibility: hidden;
            pointer-events: none;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .action-btn { padding: 10px 20px; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; font-weight: bold; }
        #undo-btn { background: #f39c12; color: white; }
        #reset-btn { background: #ff5722; color: white; display: none; }

        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; }
        #home-screen h1 { color: #8b4513; font-size: 26px; margin-bottom: 10px; }
        .start-btn { padding: 15px 30px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        #game-screen { display: none; width: 100%; }

        @media screen and (max-width: 400px) {
            .verse-text { font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="timer">時間：00:00</div>

<div id="home-screen" class="full-width">
    <h1>📖 聖經拼圖遊戲</h1>
    
    <!-- 經文卡片 -->
    <div class="verse-card">
        <p class="verse-text">「要常常喜樂，不住地禱告，凡事謝恩。」</p>
        <p class="verse-ref">— 帖撒羅尼迦前書 5:16-18</p>
    </div>

    <button class="start-btn" onclick="startGame()">開始聖經拼圖遊戲</button>
</div>

<div id="game-screen" class="full-width">
    <h2>帖撒羅尼迦前書 5:16-18</h2>
    
    <div class="action-container">
        <a href="https://www.youtube.com/shorts/mkpb6Uw1HfY" target="_blank" class="yt-link">🎥 觀看複習影片</a>
        <button class="preview-btn" onclick="showPreview()">📖 觀看神的話</button>
    </div>

    <div class="instruction">請點選下方框框裡的字，正確的字會出現在上方的空格中</div>

    <div id="slots" class="grid-container"></div>
    
    <div id="tetris-container"></div>
    
    <div class="btn-group">
        <button id="undo-btn" class="action-btn" onclick="undoLast()">⟲ 更正</button>
        <button id="reset-btn" class="action-btn" onclick="resetGame()">再玩一次</button>
    </div>
</div>

<script>
    const fullText = "要常常喜樂，不住地禱告，凡事謝恩。(帖撒羅尼迦前書 5:16-18)";
    const puncRegex = /[\-，；。、（）：「」:()?？ ]/; 
    
    let blocksData = []; 
    let activeBlock = null; 
    let gameInterval = null;
    let seconds = 0, timerStarted = false, timerInterval = null;
    let historyStack = []; // 記錄每一步的操作歷史，便於更正與還原

    function formatTime(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sec = (s % 60).toString().padStart(2, '0');
        return `時間：${m}:${sec}`;
    }

    function startGame() {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        initGame();
    }

    function resetGame() {
        if (gameInterval) clearInterval(gameInterval);
        if (timerInterval) clearInterval(timerInterval);
        seconds = 0;
        timerStarted = false;
        historyStack = [];
        document.getElementById('timer').innerText = formatTime(seconds);
        
        document.getElementById('tetris-container').style.display = 'block';
        document.getElementById('reset-btn').style.display = 'none';
        document.getElementById('undo-btn').style.display = 'inline-block';
        if (activeBlock && activeBlock.element) activeBlock.element.remove();
        initGame();
    }

    function initGame() {
        if (timerInterval) clearInterval(timerInterval);
        seconds = 0;
        timerStarted = false;
        historyStack = [];
        document.getElementById('timer').innerText = formatTime(seconds);

        const slotsDiv = document.getElementById('slots');
        slotsDiv.innerHTML = '';
        
        fullText.split('').forEach((char) => {
            if (puncRegex.test(char)) {
                let punc = document.createElement('span');
                punc.className = 'punctuation';
                punc.textContent = char;
                slotsDiv.appendChild(punc);
            } else {
                let slot = document.createElement('div');
                slot.className = 'slot empty-slot';
                slot.dataset.char = char;
                slotsDiv.appendChild(slot);
            }
        });

        const options = fullText.split('').filter(c => !puncRegex.test(c));
        const blockSize = 6; 
        blocksData = [];
        for (let i = 0; i < options.length; i += blockSize) {
            let blockChars = options.slice(i, i + blockSize);
            // 轉為物件結構保留原始索引，避免重複字干擾
            let mappedChars = blockChars.map((char, idx) => ({ char, id: i + idx }));
            mappedChars.sort(() => Math.random() - 0.5); 
            blocksData.push(mappedChars);
        }
        spawnNextBlock();
    }

    function spawnNextBlock() {
        if (blocksData.length === 0) return;
        const container = document.getElementById('tetris-container');
        container.innerHTML = ''; 
        let chars = blocksData.shift();
        let blockDiv = document.createElement('div');
        blockDiv.className = 'tetris-block';
        
        let remainingCount = chars.length;

        chars.forEach((item) => {
            let wordDiv = document.createElement('div');
            wordDiv.className = 'tetris-word';
            wordDiv.textContent = item.char;
            wordDiv.dataset.id = item.id;
            
            wordDiv.onclick = function(e) {
                e.stopPropagation();
                if (wordDiv.classList.contains('hidden')) return; // 已經點過的忽略
                
                startTimerIfNeeded();
                let targetSlot = document.querySelector('.empty-slot:not([id="filled"])');
                
                if (targetSlot && item.char === targetSlot.dataset.char) {
                    // 填入空格
                    targetSlot.textContent = item.char;
                    targetSlot.id = "filled";
                    targetSlot.style.backgroundColor = "#fff";
                    
                    // 隱藏該按鈕，避免重新渲染造成的卡頓
                    wordDiv.classList.add('hidden');
                    remainingCount--;

                    // 記錄歷史供更正使用
                    historyStack.push({ slot: targetSlot, wordDiv: wordDiv });

                    // 檢查當前方塊是否全部點完
                    if (remainingCount === 0) {
                        if (gameInterval) clearInterval(gameInterval);
                        blockDiv.remove();
                        activeBlock = null;
                        spawnNextBlock(); 
                    }

                    // 檢查遊戲是否全部完成
                    if (document.querySelectorAll('.empty-slot:not([id="filled"])').length === 0) {
                        finish();
                    }
                }
            };
            blockDiv.appendChild(wordDiv);
        });

        container.appendChild(blockDiv);

        let currentY = -60, targetY = 30;
        blockDiv.style.top = currentY + 'px';
        activeBlock = { element: blockDiv, chars: chars };
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => {
            if (currentY < targetY) { 
                currentY += 4; 
                blockDiv.style.top = currentY + 'px'; 
            } else { 
                clearInterval(gameInterval); 
            }
        }, 30);
    }

    function undoLast() {
        if (historyStack.length > 0) {
            let lastAction = historyStack.pop();
            
            // 清除格子
            lastAction.slot.textContent = "";
            lastAction.slot.removeAttribute('id');
            lastAction.slot.style.backgroundColor = "#fff";

            // 重新顯示原本被隱藏的字按鈕
            lastAction.wordDiv.classList.remove('hidden');
            
            // 如果剛好回到上一個方塊且該方塊原本被移除，這裡可以依需求處理（目前採用單一方塊內還原）
            if (activeBlock && !document.body.contains(activeBlock.element)) {
                // 如果需要跨方塊還原，可在此擴充，目前在同一個方塊內按更正皆能完美恢復
            }
        }
    }

    function showPreview() {
        const slots = document.querySelectorAll('.empty-slot');
        slots.forEach(s => { 
            if(s.id !== "filled") { 
                s.textContent = s.dataset.char; 
                s.style.backgroundColor = "#e0d0b0"; 
            }
        });
        setTimeout(() => { 
            slots.forEach(s => { 
                if(s.id !== "filled") { 
                    s.textContent = ""; 
                    s.style.backgroundColor = "#fff"; 
                }
            })
        }, 3000);
    }

    function startTimerIfNeeded() { 
        if (!timerStarted) { 
            timerStarted = true; 
            timerInterval = setInterval(() => { 
                seconds++; 
                document.getElementById('timer').innerText = formatTime(seconds); 
            }, 1000); 
        } 
    }

    function finish() {
        if (gameInterval) clearInterval(gameInterval);
        if (timerInterval) clearInterval(timerInterval);
        if (activeBlock && activeBlock.element) activeBlock.element.remove();
        
        const msg = new SpeechSynthesisUtterance("太棒了");
        msg.lang = 'zh-TW';
        window.speechSynthesis.speak(msg);

        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        document.getElementById('reset-btn').style.display = 'inline-block';
        document.getElementById('undo-btn').style.display = 'none';
        document.getElementById('tetris-container').style.display = 'none';
    }
</script>
</body>
</html>
