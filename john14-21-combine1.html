const menu = document.getElementById('menu');
const stage = document.getElementById('stage');
const back = document.getElementById('back');
const fr = document.getElementById('fr');
const barTitle = document.getElementById('barTitle');
const toHub = document.getElementById('toHub');
toHub.onclick = () => { try{ fr.contentWindow.postMessage({c517:'toHub'}, '*'); }catch(e){} };
window.addEventListener('message', e => {
  if (e.source !== fr.contentWindow) return;
  /* 回遊樂園按鈕在遊樂園版本中一直顯示 */
});

/* iPhone / iPad 聲音解鎖：必須在使用者點擊的當下執行 */
let audioCtx = null;
function unlockAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
    }
  }catch(e){}
  try{
    if ('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(' ');
      u.lang = 'zh-TW'; u.volume = 0;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function openGame(html, title, welcome, isPlay){
  unlockAudio();
  toHub.hidden = !isPlay;
  if (welcome){ try{ const w = new SpeechSynthesisUtterance(welcome); w.lang='zh-TW'; w.rate=0.85; window.speechSynthesis.speak(w); }catch(e){} }
  menu.style.display = 'none';
  barTitle.textContent = title;
  stage.classList.add('on');
  fr.onload = () => {
    try{
      const ss = fr.contentWindow.speechSynthesis;
      if (ss && !ss.__oneVoice){
        const sp = ss.speak.bind(ss), cc = ss.cancel.bind(ss);
        ss.speak = u => { try{ window.speechSynthesis.cancel(); }catch(e){} return sp(u); };
        ss.cancel = () => { try{ window.speechSynthesis.cancel(); }catch(e){} return cc(); };
        ss.__oneVoice = true;
      }
    }catch(e){}
  };
  fr.setAttribute('srcdoc', html);
}
function toMenu(){
  toHub.hidden = true;
  try{ fr.contentWindow.speechSynthesis.cancel(); }catch(e){}
  try{ window.speechSynthesis.cancel(); }catch(e){}
  stage.classList.remove('on');
  fr.removeAttribute('srcdoc');
  fr.setAttribute('src', 'about:blank');
  menu.style.display = '';
}
document.getElementById('btnA').onclick = () => openGame(A_HTML, '顯現的應許(活潑版)(約14:21)', '顯現的應許，活潑版。', false);
document.getElementById('btnB').onclick = () => openGame(B_HTML, '顯現的應許(靜態版)(約14:21)', '顯現的應許，靜態版。', false);
document.getElementById('btnC').onclick = () => openGame(C_HTML, '顯現的應許(燈塔之光版)(約14:21)', '歡迎來到燈塔之光！請照編號，一關一關玩。', true);
back.onclick = toMenu;
