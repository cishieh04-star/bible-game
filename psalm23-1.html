<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聖經拼圖 - 詩篇 23 篇</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; background-color: #fdf6e3; margin: 0; min-height: 100vh; position: relative; overflow-x: hidden; box-sizing: border-box; }
        .full-width { width: 100%; max-width: 600px; text-align: center; margin-top: 5px; }
        
        #timer { 
            position: fixed; top: 15px; right: 15px; font-size: 18px; font-weight: bold; 
            color: #8b4513; background: white; padding: 5px 10px; border-radius: 10px; 
            border: 2px solid #8b4513; z-index: 1000;
        }

        h2 { color: #8b4513; margin: 8px 0; font-size: 20px; }
        
        .action-container { margin: 8px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .yt-link { text-decoration: none; padding: 6px 12px; background: #FF0000; color: white; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .preview-btn { padding: 6px 12px; background: #5c6bc0; color: white; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 8px 0; align-items: center; }
        .slot { width: 26px; height: 26px; border: 2px dashed #8b4513; display: flex; align-items: center; justify-content: center; background-color: #fff; border-radius: 6px; font-weight: bold; font-size: 13px; color: #333; }
        
        .punctuation { font-size: 14px; font-weight: bold; color: #5d6d7e; margin: 0 1px; }
        .instruction { color: #5d6d7e; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        
        #tetris-container {
            width: 100%; max-width: 100%; height: 110px; background-color: #ffffff;
            border-radius: 8px; position: relative; overflow: hidden; margin-top: 5px;
            border: 2px solid #8b4513; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tetris-block {
            position: absolute; display: flex; gap: 4px; justify-content: center; left: 50%;
            transform: translateX(-50%); transition: top 0.05s linear; width: 95%;
        }

        .tetris-word {
            width: 38px; height: 38px; background-color: #8b4513; color: #ffffff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 18px; font-weight: bold; border-radius: 6px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2); user-select: none; flex-shrink: 0;
        }
        .tetris-word:hover { background-color: #a0522d; }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .action-btn { padding: 8px 18px; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; font-weight: bold; }
        #undo-btn { background: #f39c12; color: white; }
        #reset-btn { background: #ff5722; color: white; display: none; }
        #next-stage-btn { background: #27ae60; color: white; display: none; }

        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 75vh; text-align: center; }
        #home-screen h1 { color: #8b4513; font-size: 26px; margin-bottom: 15px; }
        .stage-select { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; margin-top: 10px; }
        .start-btn { padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        #game-screen { display: none; width: 100%; }
    </style>
</head>
<body>

<div id="timer">時間：00:00</div>

<div id="home-screen" class="full-width">
    <h1>📖 聖經拼圖遊戲</h1>
    <p class="instruction">詩篇 23 篇</p>
    <div class="stage-select">
        <button class="start-btn" onclick="startStage(1)">第一段 (1-2節)</button>
        <button class="start-btn" onclick="startStage(2)" style="background-color: #2980b9;">第二段 (3-4節)</button>
        <button class="start-btn" onclick="startStage(3)" style="background-color: #8e44ad;">第三段 (5-6節)</button>
    </div>
</div>

<div id="game-screen" class="full-width">
    <h2 id="stage-title">詩篇 23 篇</h2>
    <div class="action-container">
        <a id="yt-link-btn" href="" target="_blank" class="yt-link">🎥 觀看複習影片</a>
        <button class="preview-btn" onclick="showPreview()">📖 觀看神的話</button>
    </div>
    <div class="instruction">請點選下方框框裡的字，正確的字會出現在上方的空格中</div>
    <div id="slots" class="grid-container"></div>
    <div id="tetris-container"></div>
    <div class="btn-group">
        <button id="undo-btn" class="action-btn" onclick="undoLast()">⟲ 更正</button>
        <button id="reset-btn" class="action-btn" onclick="resetGame()">再玩一次</button>
        <button id="next-stage-btn" class="action-btn" onclick="goToNextStage()">下一段 ➡</button>
        <button class="action-btn" style="background: #7f8c8d;" onclick="goHome()">🏠 回首頁</button>
    </div>
</div>

<script>
    const stages = {
        1: { title: "詩篇 23:1-2", text: "耶和華是我的牧者，我必不致缺乏。祂使我躺臥在青草地上，領我在可安歇的水邊。", url: "https://youtube.com/shorts/UKPnCJ3TQPc?si=u5s94YXbUBrVi2wy" },
        2: { title: "詩篇 23:3-4", text: "祂使我的靈魂甦醒，為自己的名引導我走義路。我雖然行過死蔭的幽谷，也不怕遭害，因為祢與我同在；祢的杖，祢的竿，都安慰我。", url: "https://youtube.com/shorts/UKPnCJ3TQPc?si=u5s94YXbUBrVi2wy" },
        3: { title: "詩篇 23:5-6", text: "在我敵人面前，祢為我擺設筵席；祢用油膏了我的頭，使我的福杯滿溢。我一生一世必有恩惠慈愛隨著我；我且要住在耶和華的殿中，直到永遠。", url: "https://youtube.com/shorts/UKPnCJ3TQPc?si=u5s94YXbUBrVi2wy" }
    };

    let currentStage = 1;
    let fullText = "";
    const puncRegex = /[\-，；。、（）：「」:()]/; 
    let blocksData = [], activeBlock = null, gameInterval = null, seconds = 0, timerStarted = false, timerInterval = null;

    function formatTime(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sec = (s % 60).toString().padStart(2, '0');
        return `時間：${m}:${sec}`;
    }

    function startStage(stageNum) {
        currentStage = stageNum;
        fullText = stages[stageNum].text;
        document.getElementById('stage-title').innerText = stages[stageNum].title;
        document.getElementById('yt-link-btn').href = stages[stageNum].url;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        initGame();
    }

    function goHome() {
        clearInterval(gameInterval); clearInterval(timerInterval);
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
    }

    function resetGame() {
        clearInterval(gameInterval); clearInterval(timerInterval);
        seconds = 0; timerStarted = false;
        document.getElementById('timer').innerText = formatTime(seconds);
        document.getElementById('tetris-container').style.display = 'block';
        document.getElementById('reset-btn').style.display = 'none';
        document.getElementById('next-stage-btn').style.display = 'none';
        if (activeBlock && activeBlock.element) activeBlock.element.remove();
        initGame();
    }

    function goToNextStage() {
        if (currentStage < 3) startStage(currentStage + 1);
        else goHome();
    }

    function undoLast() {
        const filled = document.querySelectorAll('.slot[id="filled"]');
        if (filled.length > 0) {
            const lastSlot = filled[filled.length - 1];
            const charToReturn = lastSlot.dataset.char;
            lastSlot.textContent = ""; lastSlot.removeAttribute('id'); lastSlot.style.backgroundColor = "#fff";
            if (activeBlock) { activeBlock.chars.push(charToReturn); updateBlockDOM(activeBlock.element, activeBlock.chars); }
            else { if (blocksData.length > 0) blocksData[0].unshift(charToReturn); else { blocksData.push([charToReturn]); spawnNextBlock(); } }
        }
    }

    function showPreview() {
        const slots = document.querySelectorAll('.empty-slot');
        slots.forEach(s => { if (s.id !== "filled") { s.textContent = s.dataset.char; s.style.backgroundColor = "#e0d0b0"; } });
        setTimeout(() => { slots.forEach(s => { if (s.id !== "filled") { s.textContent = ""; s.style.backgroundColor = "#fff"; } }); }, 5000); 
    }

    function startTimerIfNeeded() {
        if (!timerStarted) {
            timerStarted = true;
            timerInterval = setInterval(() => { seconds++; document.getElementById('timer').innerText = formatTime(seconds); }, 1000);
        }
    }

    function initGame() {
        clearInterval(timerInterval);
        seconds = 0; timerStarted = false;
        document.getElementById('timer').innerText = formatTime(seconds);
        const slotsDiv = document.getElementById('slots'); slotsDiv.innerHTML = '';
        fullText.split('').forEach((char) => {
            if (puncRegex.test(char)) {
                let punc = document.createElement('span'); punc.className = 'punctuation'; punc.textContent = char; slotsDiv.appendChild(punc);
            } else {
                let slot = document.createElement('div'); slot.className = 'slot empty-slot'; slot.dataset.char = char; slotsDiv.appendChild(slot);
            }
        });
        const options = fullText.split('').filter(c => !puncRegex.test(c));
        const blockSize = 8; 
        blocksData = [];
        for (let i = 0; i < options.length; i += blockSize) {
            let blockChars = options.slice(i, i + blockSize);
            blockChars.sort(() => Math.random() - 0.5); 
            blocksData.push(blockChars);
        }
        spawnNextBlock();
    }

    function spawnNextBlock() {
        if (blocksData.length === 0) return;
        const container = document.getElementById('tetris-container'); container.innerHTML = ''; 
        let chars = blocksData.shift();
        let blockDiv = document.createElement('div'); blockDiv.className = 'tetris-block';
        function renderChars() {
            blockDiv.innerHTML = '';
            chars.forEach((char) => {
                let wordDiv = document.createElement('div'); wordDiv.className = 'tetris-word'; wordDiv.textContent = char;
                wordDiv.onclick = function(e) { e.stopPropagation(); startTimerIfNeeded();
                    let targetSlot = document.querySelector('.empty-slot:not([id="filled"])');
                    if (targetSlot && char === targetSlot.dataset.char) {
                        targetSlot.textContent = char; targetSlot.id = "filled"; targetSlot.style.backgroundColor = "#fff";
                        const charIndex = chars.indexOf(char); if (charIndex > -1) chars.splice(charIndex, 1);
                        if (chars.length === 0) { clearInterval(gameInterval); blockDiv.remove(); activeBlock = null; spawnNextBlock(); }
                        else renderChars();
                        if (document.querySelectorAll('.empty-slot:not([id="filled"])').length === 0) finish();
                    }
                };
                blockDiv.appendChild(wordDiv);
            });
        }
        renderChars(); container.appendChild(blockDiv);
        let currentY = -60; let targetY = 30; blockDiv.style.top = currentY + 'px';
        activeBlock = { element: blockDiv, chars: chars };
        clearInterval(gameInterval);
        gameInterval = setInterval(() => { if (currentY < targetY) { currentY += 4; blockDiv.style.top = currentY + 'px'; } else clearInterval(gameInterval); }, 30);
    }

    function updateBlockDOM(blockDiv, chars) {
        blockDiv.innerHTML = '';
        chars.forEach((char) => {
            let wordDiv = document.createElement('div'); wordDiv.className = 'tetris-word'; wordDiv.textContent = char;
            wordDiv.onclick = function(e) { e.stopPropagation(); startTimerIfNeeded();
                let targetSlot = document.querySelector('.empty-slot:not([id="filled"])');
                if (targetSlot && char === targetSlot.dataset.char) {
                    targetSlot.textContent = char; targetSlot.id = "filled"; targetSlot.style.backgroundColor = "#fff";
                    const charIndex = chars.indexOf(char); if (charIndex > -1) chars.splice(charIndex, 1);
                    if (chars.length === 0) { blockDiv.remove(); activeBlock = null; spawnNextBlock(); }
                    else updateBlockDOM(blockDiv, chars);
                    if (document.querySelectorAll('.empty-slot:not([id="filled"])').length === 0) finish();
                }
            };
            blockDiv.appendChild(wordDiv);
        });
    }

    function finish() {
        clearInterval(gameInterval); clearInterval(timerInterval);
        if (activeBlock && activeBlock.element) activeBlock.element.remove();
        const msg = new SpeechSynthesisUtterance("太棒了"); msg.lang = 'zh-TW'; window.speechSynthesis.speak(msg);
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        document.getElementById('reset-btn').style.display = 'inline-block';
        if (currentStage < 3) document.getElementById('next-stage-btn').style.display = 'inline-block';
        document.getElementById('undo-btn').style.display = 'none';
        document.getElementById('tetris-container').style.display = 'none';
    }
</script>
</body>
</html>
