<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聖經拼圖 - 腓立比書 4:13</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Microsoft JhengHei', sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 10px; background-color: #fdf6e3; margin: 0; 
            min-height: 100vh; position: relative; overflow-x: hidden; 
            touch-action: manipulation;
        }
        .full-width { width: 100%; max-width: 600px; text-align: center; }
        
        #timer { 
            position: fixed; top: 15px; right: 15px; font-size: 16px; font-weight: bold; 
            color: #8b4513; background: white; padding: 5px 10px; border-radius: 10px; 
            border: 2px solid #8b4513; z-index: 1000;
        }

        /* 經文卡片樣式 */
        .verse-card {
            background-color: #fff8e1;
            border: 2px solid #e6c27e;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .verse-text { font-size: 18px; font-weight: bold; color: #5d4037; line-height: 1.6; margin-bottom: 10px; text-align: justify; }
        .verse-ref { font-size: 15px; color: #8b4513; font-weight: bold; }

        h2 { color: #8b4513; margin: 10px 0; font-size: 20px; }
        
        .action-container { margin: 10px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .yt-link { text-decoration: none; padding: 6px 12px; background: #FF0000; color: white; border-radius: 5px; font-size: 13px; font-weight: bold; }
        .preview-btn { padding: 6px 12px; background: #5c6bc0; color: white; border: none; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin: 15px 0; align-items: center; }
        .slot { width: 28px; height: 28px; border: 2px dashed #8b4513; display: flex; align-items: center; justify-content: center; background-color: #fff; border-radius: 5px; font-weight: bold; font-size: 14px; color: #333; }
        
        .punctuation { font-size: 16px; font-weight: bold; color: #5d6d7e; margin: 0 1px; }
        .instruction { color: #5d6d7e; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        
        #tetris-container {
            width: 100%; max-width: 500px; height: 120px; background-color: #ffffff;
            border-radius: 8px; position: relative; overflow: hidden; margin-top: 10px;
            border: 2px solid #8b4513; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tetris-block {
            position: absolute; display: flex; gap: 4px; justify-content: center; left: 50%;
            transform: translateX(-50%); transition: top 0.05s linear; width: 95%;
        }

        .tetris-word {
            width: 40px; height: 40px; background-color: #8b4513; color: #ffffff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 18px; font-weight: bold; border-radius: 6px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2); user-select: none; flex-shrink: 0;
        }
        .tetris-word.hidden { visibility: hidden; pointer-events: none; }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .action-btn { padding: 10px 20px; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; font-weight: bold; }
        #undo-btn { background: #f39c12; color: white; }
        #reset-btn { background: #ff5722; color: white; display: none; }

        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; }
        #home-screen h1 { color: #8b4513; font-size: 26px; margin-bottom: 10px; }
        .start-btn { padding: 15px 30px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        #game-screen { display: none; width: 100%; }

        @media screen and (max-width: 400px) {
            .verse-text { font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="timer">時間：00:00</div>

<div id="home-screen" class="full-width">
    <h1>📖 聖經拼圖遊戲</h1>
    
    <!-- 首頁經文卡片 -->
    <div class="verse-card">
        <p class="verse-text">「我靠著那加給我力量的，凡事都能做。」</p>
        <p class="verse-ref">— 腓立比書 4:13</p>
    </div>

    <button class="start-btn" onclick="startGame()">開始聖經拼圖遊戲</button>
</div>

<div id="game-screen" class="full-width">
    <h2>腓立比書 4:13</h2>
    <div class="action-container">
        <a href="https://www.youtube.com/shorts/jfkwRYtO-fU" target="_blank" class="yt-link">🎥 觀看複習影片</a>
        <button class="preview-btn" onclick="showPreview()">📖 觀看神的話</button>
    </div>
    
    <div class="instruction">請點選下方框框裡的字，正確的字會出現在上方的空格中</div>
    
    <div id="slots" class="grid-container"></div>
    <div id="tetris-container"></div>
    
    <div class="btn-group">
        <button id="undo-btn" class="action-btn" onclick="undoLast()">⟲ 更正</button>
        <button id="reset-btn" class="action-btn" onclick="resetGame()">再玩一次</button>
    </div>
</div>

<script>
    const fullText = "我靠著那加給我力量的，凡事都能做。(腓立比書4:13)";
    const puncRegex = /[\-，；。、（）：「」:()?？ ]/; 
    let blocksData = [], activeBlockElement = null, gameInterval = null, seconds = 0, timerStarted = false, timerInterval = null, historyStack = [];

    function formatTime(s) {
        return `時間：${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    }

    function startGame() {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        initGame();
    }

    function initGame() {
        if(timerInterval) clearInterval(timerInterval);
        seconds = 0; timerStarted = false; historyStack = [];
        document.getElementById('timer').innerText = formatTime(seconds);
        const slotsDiv = document.getElementById('slots');
        slotsDiv.innerHTML = '';
        let charIndex = 0;
        fullText.split('').forEach(char => {
            if (puncRegex.test(char)) {
                let punc = document.createElement('span'); punc.className = 'punctuation'; punc.textContent = char; slotsDiv.appendChild(punc);
            } else {
                let slot = document.createElement('div'); slot.className = 'slot empty-slot'; slot.dataset.char = char; slot.dataset.index = charIndex++; slotsDiv.appendChild(slot);
            }
        });
        const options = fullText.split('').filter(c => !puncRegex.test(c));
        const blockSize = 6; blocksData = [];
        let globalId = 0;
        for (let i = 0; i < options.length; i += blockSize) {
            let mapped = options.slice(i, i + blockSize).map(char => ({ char, uid: 'u' + (globalId++) }));
            mapped.sort(() => Math.random() - 0.5); blocksData.push(mapped);
        }
        spawnNextBlock();
    }

    function spawnNextBlock() {
        if (blocksData.length === 0) return;
        const container = document.getElementById('tetris-container');
        container.innerHTML = ''; 
        let chars = blocksData.shift();
        let blockDiv = document.createElement('div'); blockDiv.className = 'tetris-block';
        let remaining = chars.length;
        chars.forEach(item => {
            let div = document.createElement('div');
            div.className = 'tetris-word'; div.textContent = item.char;
            div.onclick = () => {
                if (div.classList.contains('hidden')) return;
                startTimerIfNeeded();
                let target = document.querySelector('.empty-slot:not([id="filled"])');
                if (target && item.char === target.dataset.char) {
                    target.textContent = item.char; target.id = "filled"; target.style.backgroundColor = "#fff";
                    div.classList.add('hidden'); remaining--; historyStack.push({slot: target, wordDiv: div});
                    if (remaining === 0) { if(gameInterval) clearInterval(gameInterval); blockDiv.remove(); spawnNextBlock(); }
                    if (!document.querySelector('.empty-slot:not([id="filled"])')) finish();
                }
            };
            blockDiv.appendChild(div);
        });
        container.appendChild(blockDiv); activeBlockElement = blockDiv;
        let y = -60; if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => { if(y < 30) { y += 4; blockDiv.style.top = y + 'px'; } else clearInterval(gameInterval); }, 30);
    }

    function undoLast() {
        if (historyStack.length > 0) {
            let last = historyStack.pop();
            last.slot.textContent = ""; last.slot.removeAttribute('id'); last.slot.style.backgroundColor = "#fff";
            last.wordDiv.classList.remove('hidden');
        }
    }

    function resetGame() {
        document.getElementById('reset-btn').style.display = 'none';
        document.getElementById('undo-btn').style.display = 'inline-block';
        if(activeBlockElement) activeBlockElement.remove();
        initGame();
    }

    function showPreview() {
        const slots = document.querySelectorAll('.empty-slot');
        slots.forEach(s => { if(s.id !== "filled") { s.textContent = s.dataset.char; s.style.backgroundColor = "#e0d0b0"; }});
        setTimeout(() => slots.forEach(s => { if(s.id !== "filled") { s.textContent = ""; s.style.backgroundColor = "#fff"; }}), 3000);
    }

    function startTimerIfNeeded() { if (!timerStarted) { timerStarted = true; timerInterval = setInterval(() => { seconds++; document.getElementById('timer').innerText = formatTime(seconds); }, 1000); }}

    function finish() {
        if(gameInterval) clearInterval(gameInterval); if(timerInterval) clearInterval(timerInterval);
        const msg = new SpeechSynthesisUtterance("太棒了");
        msg.lang = 'zh-TW';
        window.speechSynthesis.speak(msg);
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        document.getElementById('reset-btn').style.display = 'inline-block';
        document.getElementById('undo-btn').style.display = 'none';
    }
</script>
</body>
</html>
