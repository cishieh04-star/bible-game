<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>同在應許</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>

  :root{
    --sky-top:#f6eef6;
    --sky-mid:#dcc0e0;
    --sky-bottom:#9c6ea0;
    --gold:#d9a03a;
    --ink:#3a2440;
    --ink-soft:rgba(58,36,64,0.78);
    --accent:#5c3c68;
    --seal-gold:#d9a03a;
    --glass-bg:rgba(255,235,238,0.6);
    --char-size:24px;
    --caption-size:16px;
  }
  :root.font-l{ --char-size:28px; --caption-size:18px; }
  :root.font-xl{ --char-size:32px; --caption-size:20px; }

  *{ box-sizing:border-box; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; min-height:100vh; overflow-x:hidden;
    font-family:'Microsoft JhengHei','PingFang TC',sans-serif;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:10px 12px 30px;
    transition:background 1.2s ease;
  }
  body.dawn{
    background:linear-gradient(to bottom, #faf2fa 0%, #e6cce8 45%, #c298c4 100%);
  }
  body.dawn .sil-back{ opacity:.5; }
  body.dawn .sil-front{ opacity:.65; }

  .scene-bg{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .scene-bg::before{ content:''; position:absolute; top:-15%; left:50%; width:80%; padding-top:80%;
    transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.55), transparent 68%); }
  .ambient-wrap{ position:absolute; inset:0; }
  .ambient-drop{
    position:absolute; bottom:-5%; width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle, #ffffff, #e8ccec 70%);
    box-shadow:0 0 5px rgba(240,210,245,0.9);
    animation-name:motesRise; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  }
  @keyframes motesRise{
    0%{ bottom:-5%; opacity:0; transform:translateX(0); }
    15%{ opacity:.95; }
    85%{ opacity:.55; }
    100%{ bottom:100%; opacity:0; transform:translateX(var(--drift,20px)); }
  }
  .sil{ position:absolute; bottom:0; left:0; width:100%; transition:background 1.2s ease, opacity 1.2s ease; }
  .sil-back{ height:104px; background:#7a5484; opacity:.5;
    clip-path:polygon(0 100%,0 74%,10% 60%,22% 72%,34% 54%,48% 70%,60% 52%,74% 70%,86% 56%,100% 68%,100% 100%); }
  .sil-front{ height:58px; background:#4e2e58;
    clip-path:polygon(0 100%,0 82%,14% 66%,28% 84%,42% 64%,58% 84%,72% 64%,86% 84%,96% 68%,100% 80%,100% 100%); }

  .page{ position:relative; z-index:2; width:100%; max-width:480px; }

  #timer{ position:fixed; top:10px; left:12px; font-size:13px; color:var(--ink);
    background:rgba(255,255,255,0.5); padding:4px 10px; border-radius:10px; border:1px solid rgba(58,36,64,0.3); z-index:1000; }
  .font-controls{ position:fixed; top:10px; right:12px; z-index:1000; display:flex; gap:6px; }
  .font-controls button{ width:48px; height:48px; border-radius:13px; border:2px solid rgba(58,36,64,0.75);
    background:rgba(255,255,255,0.95); color:var(--ink); font-size:19px; font-weight:bold; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.2); }

  #home{ text-align:center; padding-top:7vh; min-height:88vh; display:flex; flex-direction:column; align-items:center; }
  .eyebrow{ font-size:13px; letter-spacing:2px; color:var(--ink-soft); margin:0 0 6px; }
  .poem-title{ font-size:25px; margin:0; letter-spacing:3px; color:#5c3468;
    font-family:"KaiTi","STKaiti","BiauKai",serif; text-shadow:0 0 18px rgba(217,160,58,0.45); }
  .poet-line{ margin:6px 0 22px; font-size:14px; color:var(--ink-soft); }
  .preview-line{ font-family:"KaiTi","STKaiti","BiauKai",serif; font-size:22px; letter-spacing:4px;
    color:var(--ink); min-height:34px; margin-bottom:26px; }
  .preview-line span{ opacity:0; display:inline-block; animation:charFadeIn .6s forwards; }
  @keyframes charFadeIn{ to{ opacity:1; } }

  .candle-btn{ font-size:17px; font-weight:bold; padding:14px 28px; border:none; border-radius:30px;
    background:linear-gradient(180deg,#e6c4ea,#8c5c94); color:#241228; cursor:pointer;
    box-shadow:0 0 22px rgba(217,160,58,0.5); margin-bottom:14px; }
  .ghost-btn{ background:rgba(255,255,255,0.85); border:2px solid rgba(58,36,64,0.75); color:var(--ink);
    padding:14px 26px; border-radius:24px; font-size:19px; font-weight:bold; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.15); }
  .full-panel{ margin-top:16px; width:92%; max-width:420px; background:rgba(255,255,255,0.42);
    border:1px solid rgba(58,36,64,0.3); border-radius:12px; padding:14px 16px; text-align:left; }
  .full-text{ font-family:"KaiTi","STKaiti","BiauKai",serif; font-size:17px; line-height:1.9; color:var(--ink); }
  .full-trans{ margin-top:10px; font-size:13px; line-height:1.7; color:var(--ink-soft); }

  #game{ display:flex; flex-direction:column; align-items:center; padding-top:2vh; }
  .progress-dots{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; justify-content:center; max-width:280px; }
  .progress-dots span{ width:9px; height:9px; border-radius:50%; background:rgba(58,36,64,0.2);
    border:1px solid rgba(58,36,64,0.4); transition:background .4s; }
  .progress-dots span.done{ background:#d9a03a; box-shadow:0 0 8px rgba(217,160,58,0.7); }

  .window-scene{ position:relative; display:flex; align-items:flex-end; justify-content:center; gap:6px; width:100%; }
  .window-scene::before{ content:''; position:absolute; top:10%; left:50%; width:240px; height:240px;
    transform:translate(-50%,-30%); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(217,160,58,0.35), transparent 70%); z-index:-1; }
  
  .light-holder{ position:relative; width:44px; height:58px; margin-bottom:14px; flex-shrink:0;
    filter:drop-shadow(0 0 var(--glow,8px) #e6c4ea); transition:filter .6s; }
  .light-holder .orbA{ position:absolute; bottom:0; left:4px; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6fb,#e0aee8 55%,#d9a03a 90%); animation:glow 2s ease-in-out infinite; }
  .light-holder .orbB{ position:absolute; bottom:0; right:4px; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6fb,#e0aee8 55%,#d9a03a 90%); animation:glow 2.3s ease-in-out infinite .2s; }
  .light-holder .orbC{ position:absolute; bottom:22px; left:50%; transform:translateX(-50%); width:19px; height:19px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff8f0,#e8c088 55%,#d9a03a 90%); animation:glow 1.8s ease-in-out infinite .1s; }
  @keyframes glow{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.2); } }


  .window-frame{ position:relative; background:#f7dce0; border:3px solid #5c2430;
    border-radius:10px; padding:8px; width:100%; max-width:390px; box-shadow:0 6px 18px rgba(58,36,64,0.28); }
  .glass{ position:relative; background:var(--glass-bg); border-radius:6px; padding:14px 8px;
    min-height:70px; display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:inset 0 0 24px rgba(58,36,64,0.18); }
    .glass.ripple::after{ content:none; position:absolute; inset:0; border-radius:6px;
    background:radial-gradient(circle, rgba(255,252,240,0.6), transparent 65%);
    animation:rippleAnim .55s ease-out; }
  @keyframes rippleAnim{ 0%{ opacity:0; transform:scale(.6);} 40%{ opacity:.5;} 100%{ opacity:0; transform:scale(1.3);} }

  .hint-banner{ position:absolute; inset:6px; border-radius:6px; background:rgba(255,248,230,0.98);
    display:flex; align-items:center; justify-content:center; padding:10px 14px; z-index:6;
    box-shadow:0 4px 16px rgba(0,0,0,0.28); border:2.5px solid #f0a400; }
  .hint-banner p{ font-family:"KaiTi","STKaiti","BiauKai",serif; font-size:calc(var(--char-size) - 6px);
    line-height:1.75; color:#3a2010; text-align:center; margin:0; font-weight:bold; }
  .hint-banner.show{ animation:hintBannerIn .25s ease-out; }
  @keyframes hintBannerIn{ from{ opacity:0; transform:scale(.92); } to{ opacity:1; transform:scale(1); } }

  .slots-row{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; align-items:center; }
  .slot{ width:calc(var(--char-size) + 16px); height:calc(var(--char-size) + 16px);
    border:2.5px dashed rgba(58,36,64,0.85); border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-size:var(--char-size); font-weight:bold; color:var(--ink);
    font-family:"KaiTi","STKaiti","BiauKai",serif; background:rgba(255,255,255,0.82); }
  .slot.filled{ border-style:solid; border-width:2.5px; border-color:#d9a03a; color:var(--ink);
    text-shadow:none; background:rgba(255,255,255,0.92); box-shadow:0 0 0 1px rgba(217,160,58,0.35) inset; }
  .slot.hint-target{ animation:slotHintPulse 0.9s ease-in-out infinite; border-color:#f0a400 !important; border-style:solid !important; background:rgba(255,220,120,0.55) !important; }
  @keyframes slotHintPulse{ 0%,100%{ box-shadow:0 0 4px 2px rgba(240,164,0,0.55);} 50%{ box-shadow:0 0 20px 6px rgba(240,164,0,0.95);} }
  .punct{ font-size:calc(var(--char-size) - 4px); color:var(--ink-soft); margin:0 1px; align-self:flex-end; }

  .drop-zone{ width:100%; max-width:390px; height:120px; position:relative; margin-top:6px;
    border-radius:10px; overflow:hidden; background:linear-gradient(180deg, rgba(255,255,255,0.18), transparent);
    transition:height .3s ease; }
  .char-cluster{ position:absolute; left:50%; top:-70px; transform:translateX(-50%); display:flex; gap:8px;
    flex-wrap:wrap; justify-content:center; width:94%; transition:top .05s linear; }
  .char-drop{ width:calc(var(--char-size) + 26px); height:calc(var(--char-size) + 26px); border-radius:50%;
    background:#f3d9db; color:#4a1620;
    display:flex; align-items:center; justify-content:center; font-size:var(--char-size); font-weight:bold;
    cursor:pointer; user-select:none; box-shadow:0 2px 5px rgba(0,0,0,0.18);
    font-family:"KaiTi","STKaiti","BiauKai",serif; flex-shrink:0; text-shadow:none;
    border:2.5px solid #5c2430;
    animation:bob 2.4s ease-in-out infinite; transition:transform .18s ease; }
  .char-drop:active{ transform:scale(0.9); }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-5px) rotate(2deg); } }
  .char-drop.hint-glow{ animation:dropHintPulse 0.5s ease-in-out 3; border-color:#f0a400 !important; }
  @keyframes dropHintPulse{ 0%,100%{ box-shadow:0 0 6px 2px rgba(240,164,0,0.6); transform:scale(1);} 50%{ box-shadow:0 0 26px 8px rgba(240,164,0,0.95); transform:scale(1.15);} }
  .char-drop.wrong-shake{ animation:shake .35s; }
  @keyframes shake{ 20%,60%{ transform:translateX(-4px);} 40%,80%{ transform:translateX(4px);} }
  .char-drop.pop{ animation:popAway .28s ease forwards !important; }
  @keyframes popAway{ 0%{ transform:scale(1); opacity:1; } 60%{ transform:scale(1.35); opacity:1; } 100%{ transform:scale(0.2); opacity:0; } }

  .controls-row{ display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .ctrl-btn{ padding:17px 24px; border:2px solid rgba(58,36,64,0.75); border-radius:24px;
    background:rgba(255,255,255,0.92); color:var(--ink); font-size:20px; font-weight:bold; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .ctrl-btn.home-btn{ background:linear-gradient(180deg,#d6e6f0,#8fb4cc); border-color:rgba(16,40,56,0.55); color:#14303c; }

  #finish{ text-align:center; padding-top:6vh; display:flex; flex-direction:column; align-items:center; }
  .seal{ width:72px; height:72px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #f6e2f8, var(--seal-gold) 75%);
    color:#241228; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold;
    font-family:"KaiTi","STKaiti","BiauKai",serif; letter-spacing:1px;
    box-shadow:0 0 0 2px rgba(255,255,255,0.4), 0 4px 14px rgba(217,160,58,0.4); transform:scale(0);
    animation:stampIn .5s cubic-bezier(.34,1.56,.64,1) forwards; margin-bottom:10px; }
  @keyframes stampIn{ to{ transform:scale(1); } }
  #finish h2{ margin:2px 0 12px; font-size:18px; color:#5c3468; }
  .final-poem{ font-family:"KaiTi","STKaiti","BiauKai",serif; font-size:18px; line-height:1.9; letter-spacing:1px;
    color:var(--ink); text-shadow:none; margin-bottom:8px; padding:0 6px; }
  .final-time{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  .home-btn-row{ display:flex; gap:10px; margin-top:16px; width:92%; max-width:380px; }
  .home-btn-row button{ flex:1; padding:11px 6px; border:none; border-radius:8px; font-size:14px; font-weight:bold;
    cursor:pointer; color:#241228; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
  .start-btn{ background:linear-gradient(180deg,#e6c4ea,#8c5c94); }
  .translate-btn2{ background:linear-gradient(180deg,#e6c4ea,#8c5c94); }
  #toggleTransBtn{ margin-top:22px; }

  .mute-btn{ background:rgba(255,255,255,0.85); border:2px solid rgba(58,36,64,0.6); color:var(--ink);
    padding:12px 22px; border-radius:20px; font-size:17px; font-weight:bold; cursor:pointer; margin-top:6px; }

  [hidden]{ display:none !important; }

</style>
</head>
<body>

<div class="scene-bg" aria-hidden="true">
  <div class="ambient-wrap" id="ambientWrap"></div>
  <div class="sil sil-back"></div>
  <div class="sil sil-front"></div>
</div>

<div id="timer">思考時間 00:00</div>
<div class="font-controls">
  <button onclick="adjustFont(-1)" aria-label="縮小字體">A-</button>
  <button onclick="adjustFont(1)" aria-label="放大字體">A+</button>
</div>

<div id="home" class="page">
  <p class="eyebrow">聖經記憶遊戲 · 奉主的名聚會，主必同在</p>
  <h1 class="poem-title">馬太福音 18:20</h1>
  <p class="poet-line">新約 · 耶穌的應許</p>
  <div class="preview-line" id="previewLine"></div>
  <button class="candle-btn" onclick="enterGame()">🙏 同心聚會，開始拼經文</button>
  <button class="ghost-btn" onclick="toggleFull()">閱讀全文</button>
  <div id="fullPanel" class="full-panel" hidden>
    <div class="full-text">「因為無論在哪裡，有兩三個人奉我的名聚會，那裡就有我在他們中間。」</div>
    <div class="full-trans">馬太福音 18:20</div>
  </div>
</div>

<div id="game" class="page" hidden>
  <div class="progress-dots" id="progressDots"></div>
  <div class="window-scene">
    <div class="light-holder" id="candleHolder"><div class="orbA"></div><div class="orbB"></div><div class="orbC"></div></div>
    <div class="window-frame">
      <div class="glass" id="glass">
        <div id="slots" class="slots-row"></div>
      </div>
      <div class="hint-banner" id="hintBanner" hidden></div>
    </div>
  </div>
  <div id="dropZone" class="drop-zone"></div>
  <div class="controls-row">
    <button class="ctrl-btn" id="hintBtn" onclick="giveHint()">💡 提示</button>
    <button class="ctrl-btn" onclick="undoLast()">⟲ 更正</button>
    <button class="ctrl-btn" onclick="speakCurrentLine()">🔊 聽這句</button>
    <button class="ctrl-btn home-btn" onclick="goHome()">🏠 回首頁</button>
  </div>
</div>

<div id="finish" class="page" hidden>
  <div class="seal">同在</div>
  <h2>經文拼寫完成，主應許與你們同在</h2>
  <div class="final-poem">「因為無論在哪裡，有兩三個人奉我的名聚會，那裡就有我在他們中間。」</div>
  <p class="final-time" id="finalTime"></p>

  <div class="home-btn-row">
    <button class="start-btn" onclick="replay()">再玩一次</button>
    <button class="translate-btn2" onclick="goHome()">回首頁</button>
  </div>

  <button class="ghost-btn" id="toggleTransBtn" onclick="toggleFinalTrans()">🙏 查看祝福的話</button>
  <br>
  <button class="mute-btn" onclick="stopNarration()">🔇 不想聽語音了</button>
  <div id="finalTransPanel" class="full-panel" hidden>
    <div class="full-trans">願你相信，無論在哪裡，只要奉主的名聚會，主就應許與你們同在。<br>願你在同心禱告與團契中，常常經歷這份同在的平安。</div>
  </div>
</div>

<script>

(function(){
  "use strict";

  var lines = [
    { chars:["因","為","無","論","在","哪","裡"], punct:"，" },
    { chars:["有","兩","三","個","人","奉","我","的","名","聚","會"], punct:"，" },
    { chars:["那","裡","就","有","我","在","他","們","中","間"], punct:"。" }
  ];

  var fullVerseSpeech = "因為無論在哪裡，有兩三個人奉我的名聚會，那裡就有我在他們中間。";
  var blessingSpeech = "願你相信，無論在哪裡，只要奉主的名聚會，主就應許與你們同在。願你在同心禱告與團契中，常常經歷這份同在的平安。";

  function styleDrop(el){
    el.style.animationDelay = (-Math.random() * 2.4).toFixed(2) + 's';
  }

  var currentLine = 0;
  var activeCluster = null;
  var seconds = 0, timerStarted = false, timerInterval = null, fallInterval = null;
  var fontLevel = 0;

  function buildAmbient(){
    var wrap = document.getElementById('ambientWrap');
    var n = 26;
    for (var i = 0; i < n; i++){
      var d = document.createElement('div');
      d.className = 'ambient-drop';
      var dur = (3 + Math.random() * 3).toFixed(2);
      d.style.left = (Math.random() * 100).toFixed(1) + '%';
      d.style.setProperty('--drift', (10 + Math.random() * 40).toFixed(0) + 'px');
      d.style.animationDuration = dur + 's';
      d.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
      wrap.appendChild(d);
    }
  }

  function buildPreview(){
    var el = document.getElementById('previewLine');
    var text = "因為無論在哪裡";
    el.innerHTML = '';
    text.split('').forEach(function(ch, i){
      var s = document.createElement('span');
      s.textContent = ch;
      s.style.animationDelay = (i * 0.18) + 's';
      el.appendChild(s);
    });
  }

  function buildProgressDots(){
    var wrap = document.getElementById('progressDots');
    wrap.innerHTML = '';
    lines.forEach(function(){
      var span = document.createElement('span');
      wrap.appendChild(span);
    });
  }

  window.toggleFull = function(){
    var p = document.getElementById('fullPanel');
    p.hidden = !p.hidden;
  };
  window.toggleFinalTrans = function(){
    var p = document.getElementById('finalTransPanel');
    p.hidden = !p.hidden;
  };

  window.adjustFont = function(dir){
    fontLevel = Math.max(0, Math.min(2, fontLevel + dir));
    var root = document.documentElement;
    root.classList.remove('font-l','font-xl');
    if (fontLevel === 1) root.classList.add('font-l');
    if (fontLevel === 2) root.classList.add('font-xl');
  };

  function formatTime(s){
    var m = Math.floor(s/60).toString().padStart(2,'0');
    var sec = (s%60).toString().padStart(2,'0');
    return '思考時間 ' + m + ':' + sec;
  }
  function startTimerIfNeeded(){
    if (!timerStarted){
      timerStarted = true;
      timerInterval = setInterval(function(){
        seconds++;
        document.getElementById('timer').innerText = formatTime(seconds);
      }, 1000);
    }
  }
  function stopTimer(){
    if (timerInterval) clearInterval(timerInterval);
  }

  window.enterGame = function(){
    document.getElementById('home').hidden = true;
    document.getElementById('finish').hidden = true;
    document.getElementById('game').hidden = false;
    currentLine = 0;
    seconds = 0; timerStarted = false;
    document.getElementById('timer').innerText = formatTime(seconds);
    buildProgressDots();
    updateGlow(0);
    updateProgressDots();
    loadLine(0);
  };
  window.goHome = function(){
    stopNarration();
    stopTimer();
    if (fallInterval) clearInterval(fallInterval);
    document.body.classList.remove('dawn');
    document.getElementById('game').hidden = true;
    document.getElementById('finish').hidden = true;
    document.getElementById('home').hidden = false;
  };
  window.replay = function(){
    stopNarration();
    document.body.classList.remove('dawn');
    document.getElementById('finish').hidden = true;
    enterGame();
  };
  window.stopNarration = function(){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  };

  function updateGlow(doneCount){
    var holder = document.getElementById('candleHolder');
    var glow = 8 + doneCount * 6;
    holder.style.setProperty('--glow', glow + 'px');
  }
  function updateProgressDots(){
    var dots = document.querySelectorAll('#progressDots span');
    dots.forEach(function(d, i){
      d.classList.toggle('done', i < currentLine);
    });
  }

  function loadLine(idx){
    var line = lines[idx];
    var slotsDiv = document.getElementById('slots');
    slotsDiv.innerHTML = '';
    line.chars.forEach(function(ch){
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.char = ch;
      slotsDiv.appendChild(slot);
    });
    if (line.punct){
      var punct = document.createElement('span');
      punct.className = 'punct';
      punct.textContent = line.punct;
      slotsDiv.appendChild(punct);
    }

    speakInterrupt(line.chars.join('') + line.punct);

    var shuffled = line.chars.slice().sort(function(){ return Math.random() - 0.5; });
    spawnCluster(shuffled);
  }

  function computeZoneHeight(count){
    var cs = getComputedStyle(document.documentElement);
    var charSize = parseFloat(cs.getPropertyValue('--char-size')) || 24;
    var dropSize = charSize + 26;
    var gap = 8;
    var zone = document.getElementById('dropZone');
    var containerWidth = zone.clientWidth * 0.94 || 360;
    var perRow = Math.max(1, Math.floor((containerWidth + gap) / (dropSize + gap)));
    var rows = Math.ceil(count / perRow);
    var h = rows * (dropSize + gap) + 30;
    return Math.max(120, h);
  }

  function spawnCluster(chars){
    var zone = document.getElementById('dropZone');
    zone.innerHTML = '';
    zone.style.height = computeZoneHeight(chars.length) + 'px';
    var cluster = document.createElement('div');
    cluster.className = 'char-cluster';

    function render(){
      cluster.innerHTML = '';
      chars.forEach(function(ch){
        var drop = document.createElement('div');
        drop.className = 'char-drop';
        drop.textContent = ch;
        styleDrop(drop);
        drop.onclick = function(e){
          e.stopPropagation();
          startTimerIfNeeded();
          handleTap(ch, drop, chars, cluster, render);
        };
        cluster.appendChild(drop);
      });
    }
    render();
    zone.appendChild(cluster);

    var currentY = -70, targetY = 20;
    cluster.style.top = currentY + 'px';
    activeCluster = { element: cluster, chars: chars };

    if (fallInterval) clearInterval(fallInterval);
    fallInterval = setInterval(function(){
      if (currentY < targetY){
        currentY += 2;
        cluster.style.top = currentY + 'px';
      } else {
        clearInterval(fallInterval);
      }
    }, 30);
  }

  function handleTap(ch, dropEl, chars, clusterEl, renderFn){
    var targetSlot = document.querySelector('#slots .slot:not(.filled)');
    if (!targetSlot) return;
    if (ch === targetSlot.dataset.char){
      targetSlot.textContent = ch;
      targetSlot.classList.add('filled');
      targetSlot.classList.remove('hint-target');

      var glass = document.getElementById('glass');
      glass.classList.remove('ripple');
      void glass.offsetWidth;
      glass.classList.add('ripple');

      dropEl.onclick = null;
      dropEl.classList.add('pop');

      setTimeout(function(){
        var idx = chars.indexOf(ch);
        if (idx > -1) chars.splice(idx, 1);

        if (chars.length === 0){
          onLineComplete();
        } else {
          renderFn();
        }
      }, 220);
    } else {
      dropEl.classList.remove('wrong-shake');
      void dropEl.offsetWidth;
      dropEl.classList.add('wrong-shake');
    }
  }

  function onLineComplete(){
    if (fallInterval) clearInterval(fallInterval);
    document.getElementById('dropZone').innerHTML = '';
    activeCluster = null;

    var line = lines[currentLine];

    currentLine++;
    updateGlow(currentLine);
    updateProgressDots();

    var isLast = currentLine >= lines.length;
    speak(line.chars.join('') + line.punct, function(){
      setTimeout(function(){
        if (isLast){ finishGame(); } else { loadLine(currentLine); }
      }, 450);
    });
  }

  window.undoLast = function(){
    var filled = document.querySelectorAll('#slots .slot.filled');
    if (filled.length === 0) return;
    var lastSlot = filled[filled.length - 1];
    var ch = lastSlot.dataset.char;
    lastSlot.textContent = '';
    lastSlot.classList.remove('filled');

    if (activeCluster){
      activeCluster.chars.push(ch);
      var zone = document.getElementById('dropZone');
      var clusterEl = zone.querySelector('.char-cluster');
      if (clusterEl){
        renderClusterDom(clusterEl, activeCluster.chars);
      }
    }
  };
  function renderClusterDom(clusterEl, chars){
    clusterEl.innerHTML = '';
    chars.forEach(function(ch){
      var drop = document.createElement('div');
      drop.className = 'char-drop';
      drop.textContent = ch;
      styleDrop(drop);
      drop.onclick = function(e){
        e.stopPropagation();
        startTimerIfNeeded();
        handleTap(ch, drop, chars, clusterEl, function(){ renderClusterDom(clusterEl, chars); });
      };
      clusterEl.appendChild(drop);
    });
  }

  var hintTimer = null;
  window.giveHint = function(){
    var banner = document.getElementById('hintBanner');
    if (hintTimer) clearTimeout(hintTimer);
    banner.innerHTML = '<p>' + fullVerseSpeech + '</p>';
    banner.hidden = false;
    banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
    hintTimer = setTimeout(function(){
      banner.hidden = true;
      banner.classList.remove('show');
      hintTimer = null;
    }, 10000);
  };

  function speak(text, onDone){
    var done = false;
    function finish(){
      if (!done){ done = true; if (onDone) onDone(); }
    }
    try{
      var msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'zh-TW';
      msg.rate = 0.85;
      msg.onend = finish;
      msg.onerror = finish;
      window.speechSynthesis.speak(msg);
      var estMs = Math.min(14000, Math.max(1200, text.length * 340));
      setTimeout(finish, estMs);
    }catch(e){
      finish();
    }
  }
  function speakInterrupt(text){
    try{
      window.speechSynthesis.cancel();
      var msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'zh-TW';
      msg.rate = 0.85;
      window.speechSynthesis.speak(msg);
    }catch(e){}
  }
  window.speakCurrentLine = function(){
    if (currentLine < lines.length){
      var line = lines[currentLine];
      speakInterrupt(line.chars.join('') + line.punct);
    }
  };

  function finishGame(){
    stopTimer();
    document.getElementById('game').hidden = true;
    document.getElementById('finish').hidden = false;
    document.body.classList.add('dawn');
    document.getElementById('finalTime').textContent = '本次思考時間 ' + formatTime(seconds).replace('思考時間 ','');

    if (window.confetti){
      confetti({
        particleCount: 140,
        spread: 90,
        origin: { y: 0.55 },
        colors: ["#e6c4ea","#fff6c8","#e2c8e6","#8c5c94"]
      });
    }

    speak('太棒了，整節經文都拼好了', function(){
      setTimeout(function(){
        speak(fullVerseSpeech, function(){
          setTimeout(function(){
            var panel = document.getElementById('finalTransPanel');
            panel.hidden = false;
            speak(blessingSpeech, function(){});
          }, 500);
        });
      }, 500);
    });
  }

  buildAmbient();
  buildPreview();
})();

</script>
</body>
