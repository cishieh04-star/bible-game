const menu = document.getElementById('menu');
const stage = document.getElementById('stage');
const back = document.getElementById('back');
const fr = document.getElementById('fr');
const barTitle = document.getElementById('barTitle');

/* iPhone / iPad 聲音解鎖：必須在使用者點擊的當下執行 */
let audioCtx = null;
function unlockAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
    }
  }catch(e){}
  try{
    if ('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(' ');
      u.lang = 'zh-TW'; u.volume = 0;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function openGame(html, title){
  unlockAudio();
  menu.style.display = 'none';
  barTitle.textContent = title;
  stage.classList.add('on');
  fr.setAttribute('srcdoc', html);
}
function toMenu(){
  try{ fr.contentWindow.speechSynthesis.cancel(); }catch(e){}
  try{ window.speechSynthesis.cancel(); }catch(e){}
  stage.classList.remove('on');
  fr.removeAttribute('srcdoc');
  fr.setAttribute('src', 'about:blank');
  menu.style.display = '';
}
document.getElementById('btnA').onclick = () => openGame(A_HTML, '晨光磐石(活潑版)(民23:19)');
document.getElementById('btnB').onclick = () => openGame(B_HTML, '晨光磐石(靜態版)(民23:19)');
back.onclick = toMenu;
</script>
